  <link rel="stylesheet" href="/src/styles/app.css">

<body data-page="notifications">
  <header></header>
  <main class="ui-shell" id="notifications-page">
    <div class="ui-main notif-col">
      <section class="ui-card ui-card--flush">
        <div class="notif-head">
          <div>
            <span class="notif-eyebrow">Trung tâm thông báo</span>
            <h1>Thông báo của bạn</h1>
            <p>Cập nhật về hồ sơ ứng tuyển, tin nhắn nhà tuyển dụng và lịch phỏng vấn.</p>
          </div>
          <button type="button" class="ui-btn ui-btn--tertiary ui-btn--sm" id="mark-all-read-btn">
            <span class="material-symbols-outlined">done_all</span> Đánh dấu tất cả đã đọc
          </button>
        </div>
        <div class="ui-tabs" role="tablist" aria-label="Lọc thông báo">
          <button type="button" role="tab" id="tab-all" aria-selected="true" class="ui-tab">Tất cả</button>
          <button type="button" role="tab" id="tab-unread" aria-selected="false" class="ui-tab">Chưa đọc</button>
        </div>
        <ul class="ui-list" id="notifications-list"></ul>
      </section>
    </div>
  </main>
  <script type="module" src="/src/main.ts"></script>
