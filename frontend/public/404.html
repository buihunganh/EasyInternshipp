<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Không tìm thấy trang | Internships.io</title>
<style>
  /* Standalone page (served as-is from public/, outside the Vite bundle), so the
     tokens from src/styles/tokens.css are repeated here with the same values. */
  :root{--ui-page:#f4f2ee;--ui-surface:#ffffff;--ui-border:#e3e0da;--ui-text:#1c1f23;--ui-muted:#5b6168;--ui-primary:#b93b1d;--ui-radius-pill:999px;
    --ui-font:"Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--ui-page);color:var(--ui-text);font-family:var(--ui-font)}
  main{max-width:440px;width:100%;background:var(--ui-surface);border:1px solid var(--ui-border);border-radius:12px;padding:32px 24px;text-align:center}
  .code{font-size:14px;font-weight:600;color:var(--ui-muted);letter-spacing:.08em}
  h1{font-size:22px;margin:8px 0}
  p{color:var(--ui-muted);line-height:1.5;margin:0 0 24px}
  .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  a{display:inline-flex;align-items:center;min-height:40px;padding:0 20px;border-radius:var(--ui-radius-pill);font-weight:600;text-decoration:none}
  .primary{background:var(--ui-primary);color:var(--ui-surface)}
  .neutral{border:1px solid var(--ui-border);color:var(--ui-text)}
</style>
</head>
<body>
<main>
  <div class="code">LỖI 404</div>
  <h1>Không tìm thấy trang</h1>
  <p>Đường dẫn có thể đã thay đổi hoặc tin tuyển dụng đã bị gỡ. Hãy quay lại trang chủ để tìm các vị trí thực tập đang tuyển.</p>
  <div class="actions">
    <a class="primary" href="/">Xem việc làm thực tập</a>
    <a class="neutral" href="/pages/community/">Cộng đồng</a>
  </div>
</main>
</body>
</html>
