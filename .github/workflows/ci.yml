# Phase 14: every pull request and push to main must type-check, build and pass the database
# business-rule tests (PGlite, no network, no secrets needed).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Database business rules (PGlite)
        run: npm run test:db
      - name: Built bundle contains no service-role key
        run: |
          if grep -rIl "service_role\|SUPABASE_SERVICE_ROLE_KEY" frontend/dist; then
            echo "::error::A service-role reference ended up in the browser bundle"; exit 1
          fi
